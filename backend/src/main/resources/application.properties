spring.application.name=bankapp

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bank_app_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET:ChangeThisDevJwtSecretToAtLeast32Chars!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}